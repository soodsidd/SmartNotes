<style>
:root{color-scheme:light;--background:#f6f6f4;--foreground:#0d0d0d;--surface:#fbfbf9;--surface-foreground:#0d0d0d;--accent:oklch(0.58 0.09 195);--accent-foreground:#ffffff;--secondary:#ececf0;--secondary-foreground:#4d4d57;--muted:#f2f2f4;--muted-foreground:#8e8ea0;--border:#dedee4;--input:#dedee4;--ring:oklch(0.58 0.09 195);--destructive:oklch(0.55 0.18 25);--radius-sm:6px;--radius-md:8px;--shadow-card:0 1px 0 rgba(0,0,0,.04),0 10px 30px -20px rgba(0,0,0,.18);--font-sans:'Hanken Grotesk',system-ui,sans-serif;--font-mono:'JetBrains Mono',ui-monospace,monospace;--safe-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--background:#1e1e1e;--foreground:#ececec;--surface:#1e1e1e;--surface-foreground:#ececec;--accent:oklch(0.74 0.10 192);--accent-foreground:#1e1e1e;--secondary:#2a2a2a;--secondary-foreground:#b4b4b4;--muted:#171717;--muted-foreground:#8a8a90;--border:#333333;--input:#333333;--ring:oklch(0.74 0.10 192);--destructive:oklch(0.65 0.16 25);--shadow-card:0 1px 0 rgba(255,255,255,.04),0 10px 30px -20px rgba(0,0,0,.45)}}
*{box-sizing:border-box}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;min-height:44px;border:1px solid var(--input);border-radius:var(--radius-sm);background:var(--surface);padding:8px 12px}
button{cursor:pointer;font-weight:600;font-size:13px}button.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-foreground)}button.quiet{background:transparent;border-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:4px solid var(--ring);outline-offset:4px}
main{max-width:960px;margin:auto;padding:12px}.app-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.app-head h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:-0.01em}.status{color:var(--muted-foreground);font-size:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:12px 0;border-bottom:1px solid var(--border)}.tabs button{border:0;border-radius:var(--radius-sm) var(--radius-sm) 0 0;background:transparent;font-size:12px;padding:8px 4px}.tabs button[aria-selected=true]{background:var(--secondary);color:var(--foreground)}
.tab-short{display:none}
.panel{display:none}.panel.active{display:block}.card{border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);box-shadow:var(--shadow-card);padding:12px;margin-bottom:12px}.toolbar,.fields,.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.field{display:grid;gap:4px;min-width:120px;flex:1}.field label,.eyebrow{font-size:12px;font-weight:600;color:var(--muted-foreground)}.checks{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}.checks label{display:flex;align-items:center;gap:8px}.checks input{min-height:24px;width:24px}
.exercise{margin:12px 0;border-top:1px solid var(--border);padding-top:12px}.exercise-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.exercise-head h3{margin:0;flex:1;font-size:16px}.semantics{color:var(--muted-foreground);font-size:12px}
.exercise-actions{display:flex;gap:8px;flex-wrap:wrap}.exercise-actions button{font-size:12px;padding:8px;min-height:40px}
.set-grid{display:grid;grid-template-columns:40px minmax(64px,1fr) minmax(64px,1fr) minmax(64px,1fr) minmax(88px,1.3fr) 44px;gap:8px;align-items:center;margin-top:12px}.set-grid .head{font-size:12px;font-weight:600;color:var(--muted-foreground)}.set-grid input{width:100%;min-width:0;font-size:16px;padding:4px}.set-grid button{padding:4px;min-height:44px}
.set-row{display:contents}.set-num,.set-target{font-size:12px}.set-field-label{display:none}
.previous{display:grid;gap:4px;font-size:12px;color:var(--muted-foreground)}.previous button{min-width:44px;width:100%;padding:4px;font-size:12px}.previous-result{display:block}.previous-tap{display:none}.timer{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px;padding:8px}
.history-row{border-bottom:1px solid var(--border);padding:12px 0}.history-row summary{cursor:pointer;font-weight:600;font-size:13px}.nested{padding-left:12px;color:var(--secondary-foreground);font-size:12px}.nested .set-lines{margin:4px 0 8px;padding-left:16px}.nested .set-lines li{margin:4px 0}
.metric{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric .card{margin:0}.warning{color:var(--destructive);font-size:12px}textarea{width:100%;min-height:80px;font-size:13px}.empty{padding:24px;text-align:center;color:var(--muted-foreground);font-size:13px}
.previous-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}.previous [data-copy-set]{grid-column:1 / -1}
.session-more{margin-top:8px;border-top:1px solid var(--border);padding-top:8px}.session-more>summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--muted-foreground);list-style:none;min-height:40px;display:flex;align-items:center}.session-more>summary::-webkit-details-marker{display:none}.session-more[open]>summary{margin-bottom:8px}.session-primary{margin-bottom:0}
h2{font-size:16px;margin:0 0 8px}
@media(max-width:640px){
  body{font-size:12px;line-height:1.4}
  main{padding:8px}
  .app-head{gap:8px}.app-head h1{font-size:16px;width:auto;flex:1 1 auto}.status{flex:1 1 100%;order:3;font-size:10px}
  .timer{font-size:12px;padding:8px;min-height:40px}
  .tabs{position:sticky;top:0;z-index:3;background:var(--background);padding-top:4px;margin:8px 0;box-shadow:0 1px 0 var(--border)}.tabs button{padding:8px 4px;font-size:12px;min-height:40px}
  .tab-full{display:none}.tab-short{display:inline}
  .card{padding:12px;margin-bottom:12px}
  .field{min-width:0}.field label,.eyebrow{font-size:10px}
  .exercise-head h3{font-size:13px;width:100%;flex-basis:100%}.semantics{width:100%}
  .exercise-actions{width:100%}.exercise-actions button{flex:1;min-height:40px}
  .set-grid{display:flex;flex-direction:column;gap:8px;margin-top:8px}
  .set-grid>.head{display:none}
  .set-row{display:grid;grid-template-columns:1fr 1fr auto;grid-template-areas:"meta meta done" "weight reps done" "prev prev done";gap:8px;align-items:end;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--muted);box-shadow:none}
  .set-num{grid-area:meta;font-size:12px;font-weight:700}.set-target{grid-area:meta;justify-self:end;font-size:12px;color:var(--muted-foreground);font-weight:600}
  .set-weight{grid-area:weight}.set-measure{grid-area:reps}.set-done{grid-area:done;align-self:stretch;min-width:48px;background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
  .set-previous{grid-area:prev}
  .set-field-label{display:block;font-size:10px;font-weight:600;color:var(--muted-foreground);margin-bottom:4px}
  .set-grid input{min-height:44px;font-size:16px}
  .previous{font-size:12px}.previous-result,.previous-actions{display:none}.previous-tap{display:block;width:100%;text-align:left;font-size:12px;min-height:40px;padding:8px}
}
</style>
<main>
  <header class="app-head"><h1>Workout &amp; Nutrition</h1><span id="sync-status" class="status" role="status">Loading vault data…</span><button id="workout-timer" class="quiet timer" type="button" aria-label="Workout timer">W 00:00</button><button id="rest-timer" class="quiet timer" type="button" aria-label="Rest timer">R 00:00</button></header>
  <nav class="tabs" role="tablist" aria-label="Workout and nutrition"><button role="tab" aria-selected="true" data-tab="workout" type="button"><span class="tab-full">Workout</span><span class="tab-short">Lift</span></button><button role="tab" aria-selected="false" data-tab="nutrition" type="button"><span class="tab-full">Nutrition</span><span class="tab-short">Food</span></button><button role="tab" aria-selected="false" data-tab="history" type="button"><span class="tab-full">History</span><span class="tab-short">Log</span></button><button role="tab" aria-selected="false" data-tab="progress" type="button"><span class="tab-full">Progress</span><span class="tab-short">PRs</span></button></nav>
  <section id="workout" class="panel active" role="tabpanel"></section>
  <section id="nutrition" class="panel" role="tabpanel"></section>
  <section id="history" class="panel" role="tabpanel"></section>
  <section id="progress" class="panel" role="tabpanel"></section>
</main>

/*__WORKOUT_DOMAIN__*/
</script>
<script>
(() => {
  'use strict';
  const D=WorkoutDomain, status=document.querySelector('#sync-status');
  const DRAFTS_TABLE='drafts', DRAFT_KIND='workout';
  const state={rows:[],schema:null,form:null,adapter:null,draftRaw:{},view:null,tab:'workout',timers:{workout:{elapsedMs:0,runningSince:null},rest:{elapsedMs:0,runningSince:null}},draftRowId:null,draftLastSerialized:null,draftDebounce:null,draftSaving:false,draftSaveQueued:false};
  const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const at=(value,path)=>path?.reduce((cursor,key)=>cursor&&cursor[key],value);
  const put=(value,path,next)=>{let cursor=value;path.forEach((key,index)=>{if(index===path.length-1)cursor[key]=next;else cursor=cursor[key]&&typeof cursor[key]==='object'?cursor[key]:(cursor[key]={})})};
  const defaults=schema=>{if(!schema||typeof schema!=='object')return null;if(schema.default!==undefined)return D.clone(schema.default);if(schema.type==='object'||schema.properties){const value={};Object.entries(schema.properties||{}).forEach(([key,child])=>{const next=defaults(child);if(next!==null)value[key]=next});return value}if(schema.type==='array')return[];if(schema.type==='boolean')return false;return null};
  const optionPatterns={workout:/workout|strength|lifting/i,nutrition:/nutrition|meal|food/i,activity:/activity|tennis|recovery|cardio/i};
  const fieldSchema=name=>state.form?.schema?.properties?.[state.adapter.fields[name]?.[0]];
  const option=(field,desired)=>{const node=fieldSchema(field),values=node?.enum||[],pattern=optionPatterns[desired]||new RegExp('^'+desired+'$','i');return values.find(value=>pattern.test(String(value)))||values.find(value=>String(value).toLowerCase()===desired)||desired};
  const normalizedRows=()=>state.rows.map(row=>({...row,values:D.legacyToView(row.values,state.adapter)}));
  const currentPrescription=()=>{const definition=state.adapter.workouts[state.view?.workout];return definition?{exercises:definition.exercises.map(exercise=>({id:exercise.id,label:exercise.label,equipment:exercise.equipment,setCount:exercise.sets.filter(set=>set.kind==='working').length,sets:exercise.sets.map(set=>({kind:set.kind,number:set.number,measure:set.paths.reps?'reps':set.paths.seconds?'seconds':null,repMax:set.target?.max??null,target:set.target||null}))}))}:null};
  const setField=(name,value)=>{state.view[name]=value;renderWorkout()};
  const mutationId=()=>{const bytes=new Uint32Array(4);crypto.getRandomValues(bytes);return 'm_'+Array.from(bytes,value=>value.toString(36)).join('_')};
  // Durable in-progress draft (SN-268): host-queued by stable key so offline edits,
  // reloads, and late live snapshots cannot replace the newest local form state.
  const draftDebounceMs=()=>{const override=Number(window.__SN_DRAFT_DEBOUNCE_MS);return Number.isFinite(override)&&override>=0?override:1000};
  const hasSetValue=view=>Array.isArray(view?.exercises)&&view.exercises.some(exercise=>(exercise.sets||[]).some(set=>set&&(D.roundToIncrement(set.weight,1)!==null||D.roundToIncrement(set.reps,1)!==null||D.roundToIncrement(set.seconds,1)!==null)));
  // A freshly reset entry auto-selects a workout letter, so a bare letter is not "in progress".
  // Only real user input (typed sets, notes, or header fields) makes a draft worth persisting,
  // which keeps a cleared post-Accept form from resurfacing as a stale empty draft.
  const isDraftMeaningful=view=>Boolean(view&&(hasSetValue(view)||String(view.notes||'').trim()||view.date||view.duration!=null||view.energy!=null||view.timeCrunch||view.painStopped));
  function scheduleDraftSave(){if(state.draftDebounce)clearTimeout(state.draftDebounce);state.draftDebounce=setTimeout(runDraftSave,draftDebounceMs())}
  async function runDraftSave(){state.draftDebounce=null;if(state.draftSaving){state.draftSaveQueued=true;return}state.draftSaving=true;try{await persistDraft()}finally{state.draftSaving=false;if(state.draftSaveQueued){state.draftSaveQueued=false;scheduleDraftSave()}}}
  async function persistDraft(){if(!state.form||!state.view||!isDraftMeaningful(state.view))return;const serialized=JSON.stringify(state.view);if(serialized===state.draftLastSerialized)return;const values={kind:DRAFT_KIND,view:D.clone(state.view),savedAt:new Date().toISOString()};try{const result=await smartNotesApp.upsert(DRAFTS_TABLE,DRAFT_KIND,values,mutationId());state.draftRowId=result&&result.row&&result.row.id||'r_u_'+DRAFT_KIND;state.draftLastSerialized=serialized;status.textContent=result&&result.pending?'Draft saved locally — syncing':'Draft saved'}catch(error){status.textContent='Draft could not be stored safely: '+error.message+' Open Develop → Data for recovery.'}}
  function retiredDraft(){return{tableId:DRAFTS_TABLE,upsertKey:DRAFT_KIND,mutationId:mutationId(),values:{kind:'retired',view:{},savedAt:new Date().toISOString()}}}
  async function restoreDraft(){if(!smartNotesApp.query)return false;try{const response=await smartNotesApp.query(DRAFTS_TABLE,{where:{kind:DRAFT_KIND},limit:50});const rows=(response&&response.rows)||[];const valid=rows.filter(row=>row&&row.values&&row.values.kind===DRAFT_KIND&&row.values.view&&typeof row.values.view==='object');if(!valid.length)return false;valid.sort((a,b)=>String(b.values.savedAt||b.createdAt||'').localeCompare(String(a.values.savedAt||a.createdAt||'')));const latest=valid[0];const view=D.clone(latest.values.view);if(!isDraftMeaningful(view))return false;state.draftRaw=defaults(state.form.schema)||{};const workoutEntryType=option('entryType','workout');if(state.adapter.fields.entryType)put(state.draftRaw,state.adapter.fields.entryType,workoutEntryType);if(view.workout&&state.adapter.fields.workout)put(state.draftRaw,state.adapter.fields.workout,view.workout);state.view=view;state.draftRowId=latest.id;state.draftLastSerialized=JSON.stringify(view);state.tab='workout';for(const extra of valid.slice(1)){if(smartNotesApp.delete){try{await smartNotesApp.delete(DRAFTS_TABLE,extra.id)}catch(error){/* deduplicate to a single durable draft, best-effort */}}}renderWorkout();return true}catch(error){return false}}
  function activate(tab){state.tab=tab;document.querySelectorAll('[role=tab]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===tab)));document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.id===tab));if(tab==='history')renderHistory();if(tab==='progress')renderProgress()}
  document.querySelectorAll('[role=tab]').forEach(button=>button.onclick=()=>activate(button.dataset.tab));
  // The workout panel element is stable across re-renders, so one bubble-phase listener
  // captures every keystroke into the set grid and header fields after state.view updates.
  ['input','change'].forEach(type=>document.querySelector('#workout').addEventListener(type,()=>scheduleDraftSave()));
  function timerText(timer){const value=D.timerReducer(timer,'tick');const seconds=Math.floor(value.elapsedMs/1000);return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
  function bindTimer(id,key){const button=document.querySelector(id);button.onclick=()=>{state.timers[key]=D.timerReducer(state.timers[key],state.timers[key].runningSince===null?'start':'pause');button.dataset.running=String(state.timers[key].runningSince!==null)};button.ondblclick=()=>{state.timers[key]=D.timerReducer(state.timers[key],'reset')}}
  bindTimer('#workout-timer','workout');bindTimer('#rest-timer','rest');setInterval(()=>{document.querySelector('#workout-timer').textContent='W '+timerText(state.timers.workout);document.querySelector('#rest-timer').textContent='R '+timerText(state.timers.rest)},1000);
  function newWorkout(){state.draftRaw=defaults(state.form.schema)||{};const suggested=D.suggestDefaults(),workoutEntryType=option('entryType','workout');if(state.adapter.fields.entryType)put(state.draftRaw,state.adapter.fields.entryType,workoutEntryType);state.view=D.legacyToView(state.draftRaw,state.adapter);state.view.entryType='workout';state.view.legacyEntryType=workoutEntryType;state.view.suggestions=suggested;renderWorkout()}
  function selectWorkout(letter){state.view.workout=letter;const path=state.adapter.fields.workout;if(path)put(state.draftRaw,path,letter);const rebuilt=D.legacyToView(state.draftRaw,state.adapter);state.view.exercises=rebuilt.exercises;renderWorkout()}
  function previousWorkout(){return normalizedRows().filter(row=>row.values.workout===state.view.workout).sort((a,b)=>String(b.values.date||b.createdAt).localeCompare(String(a.values.date||a.createdAt)))[0]?.values||null}
  function renderWorkout(){
    const host=document.querySelector('#workout'),view=state.view;if(!view){host.innerHTML='<p class="empty">Loading…</p>';return}
    const suggestion=view.suggestions||D.suggestDefaults();
    const energyControl=Array.isArray(fieldSchema('energy')?.enum)?`<select id="energy"><option value="">Choose</option>${fieldSchema('energy').enum.map(value=>`<option ${view.energy===value?'selected':''}>${esc(value)}</option>`).join('')}</select>`:`<input id="energy" inputmode="decimal" type="${fieldSchema('energy')?.type==='string'?'text':'number'}" value="${esc(view.energy??'')}">`;
    host.innerHTML=`<div class="card"><div class="fields session-primary"><div class="field"><label>Date<input id="session-date" type="date" value="${esc(view.date||'')}"></label></div><div class="field"><label>Workout<select id="workout-select"><option value="">Choose</option>${['A','B','C','D','E'].map(value=>`<option ${view.workout===value?'selected':''}>${value}</option>`).join('')}</select></label></div></div><details class="session-more"><summary>Session options</summary><div class="eyebrow">Suggestions — tap to use</div><div class="actions"><button type="button" data-suggest="date">${esc(suggestion.date)}</button><button type="button" data-suggest="workout">${suggestion.workout?'Workout '+esc(suggestion.workout):'Choose workout'}</button><button type="button" data-suggest="duration">${esc(suggestion.duration)} minutes</button><button type="button" id="use-last">Use last session</button><button type="button" id="copy-workout">Copy complete workout</button></div><div class="fields" style="margin-top:8px"><div class="field"><label>Duration (min)<input id="duration" inputmode="numeric" type="number" value="${esc(view.duration??'')}"></label></div><div class="field"><label>Energy${energyControl}</label></div></div><div class="checks"><label><input id="time-crunch" type="checkbox" ${view.timeCrunch?'checked':''}>Time-crunch mode</label><label><input id="pain-stopped" type="checkbox" ${view.painStopped?'checked':''}>Stopped due to pain</label></div></details></div>
    <div id="exercises">${view.exercises.length?view.exercises.map(exerciseHtml).join(''):'<p class="empty">Choose Workout A–E to load its prescribed exercises.</p>'}</div>
    <div class="card"><label class="field">Notes<textarea id="workout-notes">${esc(view.notes||'')}</textarea></label><div class="actions"><button id="accept-workout" class="primary" type="button">Accept workout</button><span id="validation" class="warning" role="alert"></span></div></div>`;
    host.querySelectorAll('[data-suggest]').forEach(button=>button.onclick=()=>{const kind=button.dataset.suggest;if(kind==='date')view.date=suggestion.date;if(kind==='duration')view.duration=suggestion.duration;if(kind==='workout'&&suggestion.workout)selectWorkout(suggestion.workout);else renderWorkout()});
    host.querySelector('#session-date').oninput=event=>view.date=event.target.value;host.querySelector('#workout-select').onchange=event=>selectWorkout(event.target.value);host.querySelector('#duration').oninput=event=>view.duration=Number(event.target.value)||null;host.querySelector('#energy').oninput=event=>view.energy=fieldSchema('energy')?.type==='number'?Number(event.target.value)||null:event.target.value;host.querySelector('#time-crunch').onchange=event=>view.timeCrunch=event.target.checked;host.querySelector('#pain-stopped').onchange=event=>view.painStopped=event.target.checked;host.querySelector('#workout-notes').oninput=event=>view.notes=event.target.value;
    host.querySelector('#use-last').onclick=()=>{const last=previousWorkout();if(last){const current={entryType:view.entryType,legacyEntryType:view.legacyEntryType,date:view.date,workout:view.workout,suggestions:view.suggestions};state.view={...view,...D.clone(last),...current,exercises:D.copyScope(view,last,{kind:'workout'}).exercises};renderWorkout()}};host.querySelector('#copy-workout').onclick=()=>{const last=previousWorkout();if(last){state.view=D.copyScope(view,last,{kind:'workout'});state.view.suggestions=view.suggestions;renderWorkout()}};
    bindSetActions();host.querySelector('#accept-workout').onclick=acceptWorkout;
    scheduleDraftSave();
  }
  function exerciseHtml(exercise,exerciseIndex){const prior=normalizedRows(),proposed=D.proposeWorkingLoad(prior,exercise),warmups=D.warmupLoads(proposed,exercise.equipment),last=previousWorkout(),priorExercise=last?.exercises?.find(candidate=>String(candidate.id).toLowerCase()===String(exercise.id).toLowerCase()),prescription=currentPrescription()?.exercises?.[exerciseIndex],progression=D.progressionSuggestion(priorExercise,prescription);return `<article class="card exercise" data-exercise="${exerciseIndex}"><div class="exercise-head"><h3>${esc(exercise.label)}</h3><span class="semantics ${exercise.equipment==='unknown'?'warning':''}">${esc(D.equipment(exercise.equipment).label)}</span><div class="exercise-actions"><button type="button" data-copy-exercise="${exerciseIndex}">Copy exercise</button>${exercise.equipment==='barbell'?`<button type="button" data-plates="${exerciseIndex}">Plate calculator</button>`:''}</div></div><p class="status" data-plate-result="${exerciseIndex}">${proposed?`Latest: ${esc(proposed)}. Warm-ups: ${warmups.map(esc).join(' / ')||'n/a'}.`:''}${progression?' '+esc(progression.message)+(progression.load?' '+esc(progression.load)+'.':''):''}</p><div class="set-grid"><span class="head">Set</span><span class="head">Target</span><span class="head">Weight</span><span class="head">Reps/time</span><span class="head">Previous</span><span class="head">Done</span>${exercise.sets.map((set,setIndex)=>setHtml(exercise,exerciseIndex,set,setIndex)).join('')}</div></article>`}
  function setHtml(exercise,exerciseIndex,set,setIndex){const previous=D.findPreviousSet(normalizedRows(),exercise,setIndex+1)?.set,target=set.target?.label||(set.target&&(set.target.min!==null||set.target.max!==null)?`${set.target.min??'—'}–${set.target.max??'—'}`:set.kind==='working'?'Work':set.kind),setDefinition=state.adapter.workouts[state.view.workout]?.exercises?.[exerciseIndex]?.sets?.[setIndex],timed=Boolean(setDefinition?.paths?.seconds),prevLabel=previous?((previous.weight??'—')+' × '+(previous.reps??previous.seconds??'—')):'—',measure=`<input aria-label="${esc(exercise.label)} set ${setIndex+1} reps or seconds" data-set-field="${timed?'seconds':'reps'}" data-focus-first="${exercise.equipment==='bodyweight'||timed}" data-exercise="${exerciseIndex}" data-set="${setIndex}" inputmode="numeric" type="number" value="${esc(set.seconds??set.reps??'')}">`,weight=`<input aria-label="${esc(exercise.label)} set ${setIndex+1} weight" data-set-field="weight" data-exercise="${exerciseIndex}" data-set="${setIndex}" inputmode="decimal" type="number" value="${esc(set.weight??'')}">`;return `<div class="set-row"><span class="set-num">${setIndex+1}</span><span class="set-target">${esc(target)}</span><div class="set-weight"><span class="set-field-label">Weight</span>${weight}</div><div class="set-measure"><span class="set-field-label">${timed?'Sec':'Reps'}</span>${measure}</div><span class="previous set-previous"><span class="previous-result">${esc(prevLabel)}</span><button type="button" class="previous-tap" aria-label="Copy previous set" data-copy-set="${exerciseIndex}:${setIndex}" ${previous?'':'disabled'}>${previous?'Prev '+esc(prevLabel)+' · tap to copy':'No previous set'}</button><span class="previous-actions">${previous?`<button type="button" aria-label="Copy previous weight" data-copy-field="${exerciseIndex}:${setIndex}:weight">Wt</button><button type="button" aria-label="Copy previous ${timed?'seconds':'reps'}" data-copy-field="${exerciseIndex}:${setIndex}:${timed?'seconds':'reps'}">${timed?'Sec':'Reps'}</button>`:''}<button type="button" aria-label="Copy previous set" data-copy-set="${exerciseIndex}:${setIndex}">Set</button></span></span><button type="button" class="set-done" aria-label="Mark set complete" data-complete="${exerciseIndex}:${setIndex}">✓</button></div>`}
  function bindSetActions(){const host=document.querySelector('#workout'),logicalInputs=[...host.querySelectorAll('[data-set-field]')].map((node,index)=>({node,index})).sort((left,right)=>Number(left.node.dataset.exercise)-Number(right.node.dataset.exercise)||Number(left.node.dataset.set)-Number(right.node.dataset.set)||(left.node.dataset.focusFirst==='true'?0:1)-(right.node.dataset.focusFirst==='true'?0:1)||({weight:0,reps:1,seconds:1}[left.node.dataset.setField]??2)-({weight:0,reps:1,seconds:1}[right.node.dataset.setField]??2)||left.index-right.index).map(item=>item.node);host.querySelectorAll('[data-set-field]').forEach(input=>{input.oninput=event=>{const node=event.target;state.view.exercises[Number(node.dataset.exercise)].sets[Number(node.dataset.set)][node.dataset.setField]=Number(node.value)||null};input.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();logicalInputs[logicalInputs.indexOf(event.target)+1]?.focus()}}});host.querySelectorAll('[data-copy-field]').forEach(button=>button.onclick=()=>{const [exerciseIndex,setIndex,field]=button.dataset.copyField.split(':'),last=previousWorkout();if(last){state.view=D.copyScope(state.view,last,{kind:'field',exerciseIndex:Number(exerciseIndex),setIndex:Number(setIndex),field});renderWorkout()}});host.querySelectorAll('[data-copy-set]').forEach(button=>button.onclick=()=>{const [exerciseIndex,setIndex]=button.dataset.copySet.split(':').map(Number),last=previousWorkout();if(last){state.view=D.copyScope(state.view,last,{kind:'set',exerciseIndex,setIndex});renderWorkout()}});host.querySelectorAll('[data-copy-exercise]').forEach(button=>button.onclick=()=>{const exerciseIndex=Number(button.dataset.copyExercise),last=previousWorkout();if(last){state.view=D.copyScope(state.view,last,{kind:'exercise',exerciseIndex});renderWorkout()}});host.querySelectorAll('[data-plates]').forEach(button=>button.onclick=()=>{const index=Number(button.dataset.plates),exercise=state.view.exercises[index],load=Math.max(0,...exerc   async function acceptWorkout(){const target=document.querySelector('#validation'),values=D.viewToLegacy(state.view,state.draftRaw,state.adapter);if(state.adapter.fields.entryType)put(values,state.adapter.fields.entryType,state.view.legacyEntryType||option('entryType','workout'));const errors=D.validateWorkout(state.view,currentPrescription()),definition=state.adapter.workouts[state.view.workout],durationSchema=fieldSchema('duration');if(definition)validateSchema(state.form.schema.properties?.[definition.key],values[definition.key],definition.label,errors);if(durationSchema)validateSchema(durationSchema,state.view.duration,durationSchema.title||'Duration',errors);if(errors.length){target.textContent=errors.join(' ');return}status.textContent='Accepting safely…';try{const result=await smartNotesApp.accept('entries',values,mutationId(),retiredDraft());state.draftLastSerialized=null;state.draftRowId=null;status.textContent=result.pending?'Accepted locally — syncing in background':'Saved';await load();newWorkout()}catch(error){status.textContent='Entry was not accepted: '+error.message+' Your draft remains on this device.'}}
  function relevantGeneralFields(kind){const pattern=kind==='nutrition'?/nutrition|meal|food/i:/activity|tennis|recovery|cardio|movement/i,entryKey=state.adapter.fields.entryType?.[0];return Object.entries(state.form.schema.properties||{}).filter(([key,schema])=>key!==entryKey&&!/^workout[a-e]$/i.test(key)&&(/date|energy|notes?/i.test(key)||pattern.test(key+' '+(schema.title||''))))}
  function validateSchema(schema,value,label,errors){if(!schema||value===null||value===undefined||value==='')return errors;if(Array.isArray(schema.enum)&&!schema.enum.includes(value))errors.push(`${label} must use an allowed value.`);if(schema.type==='number'&&(typeof value!=='number'||!Number.isFinite(value)))errors.push(`${label} must be a number.`);if(typeof value==='number'&&value<0)errors.push(`${label} cannot be negative.`);if(typeof value==='number'&&schema.minimum!==undefined&&value<schema.minimum)errors.push(`${label} must be at least ${schema.minimum}.`);if(typeof value==='number'&&schema.maximum!==undefined&&value>schema.maximum)errors.push(`${label} must be at most ${schema.maximum}.`);if(schema.type==='object'||schema.properties){for(const key of schema.required||[]){if(value?.[key]===null||value?.[key]===undefined||value?.[key]==='')errors.push(`${schema.properties?.[key]?.title||key} is required.`)}for(const [key,child] of Object.entries(schema.properties||{}))validateSchema(child,value?.[key],child.title||key,errors)}return errors}
  function renderNutrition(){const host=document.querySelector('#nutrition'),raw=defaults(state.form.schema)||{},entryKey=state.adapter.fields.entryType?.[0],entrySchema=state.form.schema.properties?.[entryKey],configured=(entrySchema?.enum||[]).filter(value=>optionPatterns.nutrition.test(String(value))||optionPatterns.activity.test(String(value))),choices=configured.length?configured:[option('entryType','nutrition'),option('entryType','activity')];let selected=choices.find(value=>optionPatterns.nutrition.test(String(value)))||choices[0];if(entryKey)raw[entryKey]=selected;const draw=()=>{const kind=optionPatterns.nutrition.test(String(selected))?'nutrition':'activity',fields=relevantGeneralFields(kind);host.innerHTML=`<div class="card"><h2>Nutrition &amp; activity</h2><p class="status">Nutrition, general activity, tennis, and recovery fields come from your private vault form.</p><label class="field">Entry type<select id="general-type">${choices.map(value=>`<option ${value===selected?'selected':''}>${esc(value)}</option>`).join('')}</select></label><div id="general-fields">${fields.map(([key,schema])=>generalField([key],schema,raw)).join('')}</div><div class="actions"><button id="accept-general" class="primary">Accept entry</button><span id="general-validation" class="warning" role="alert"></span></div></div>`;host.querySelector('#general-type').onchange=event=>{selected=event.target.value;if(entryKey)raw[entryKey]=selected;draw()};host.querySelectorAll('[data-general]').forEach(input=>{input.oninput=event=>{const node=event.target,path=JSON.parse(decodeURIComponent(node.dataset.general));let value=node.type==='checkbox'?node.checked:node.type==='number'?Number(node.value)||null:node.value;if(node.dataset.json){try{value=JSON.parse(node.value)}catch{}}put(raw,path,value)}});host.querySelector('#accept-general').onclick=async()=>{const errors=[];for(const [key,schema] of fields)validateSchema(schema,raw[key],schema.title||key,errors);if(errors.length){host.querySelect   function generalField(path,schema,raw){const label=esc(schema.title||path[path.length-1]),value=at(raw,path),encoded=encodeURIComponent(JSON.stringify(path));if(schema.type==='object'||schema.properties)return `<fieldset class="card"><legend>${label}</legend><div class="fields">${Object.entries(schema.properties||{}).map(([key,child])=>generalField(path.concat(key),child,raw)).join('')}</div></fieldset>`;if(schema.type==='array')return `<label class="field">${label}<textarea data-general="${encoded}" data-json="true">${esc(JSON.stringify(value||[]))}</textarea></label>`;if(schema.type==='boolean')return `<label class="field">${label}<input data-general="${encoded}" type="checkbox" ${value?'checked':''}></label>`;if(Array.isArray(schema.enum))return `<label class="field">${label}<select data-general="${encoded}"><option value="">Choose</option>${schema.enum.map(item=>`<option ${item===value?'selected':''}>${esc(item)}</option>`).join('')}</select></label>`;return `<label class="field">${label}<input data-general="${encoded}" type="${schema.format==='date'?'date':schema.type==='number'?'number':'text'}" ${schema.type==='number'?'inputmode="decimal"':''} value="${esc(value??'')}"></label>`}
  function renderHistory(){const host=document.querySelector('#history'),rows=normalizedRows().slice().sort((a,b)=>String(b.values.date||b.createdAt).localeCompare(String(a.values.date||a.createdAt)));host.innerHTML=rows.length?`<div class="card"><h2>History</h2>${rows.map(row=>`<details class="history-row"><summary>${esc(row.values.date||row.createdAt)} · ${row.values.workout?'Workout '+esc(row.values.workout):esc(row.values.entryType)}</summary><div class="nested">${(row.values.exercises||[]).map(exercise=>`<p><strong>${esc(exercise.label)}</strong></p><ul class="set-lines">${(exercise.sets||[]).map(set=>`<li>${esc((set.weight??'—')+' × '+(set.reps??set.seconds??'—'))}</li>`).join('')}</ul>`).join('')}<p>${esc(row.values.notes||'')}</p></div></details>`).join('')}</div>`:'<p class="empty">No history yet.</p>'}
  function renderProgress(){const rows=normalizedRows(),records=D.personalRecords(rows),host=document.querySelector('#progress');host.innerHTML=`<div class="card"><h2>Progress</h2><div class="metric">${Object.entries(records).map(([id,record])=>{const trend=D.exerciseTrend(rows,{id}),recent=trend.slice(-2),latest=recent[recent.length-1],change=recent.length===2&&recent[0].metric===recent[1].metric?recent[1].value-recent[0].value:null,comparison=latest?` · recent ${esc(latest.metric)}: ${esc(latest.value)} ${esc(latest.unit)}${change===null?'':` (${change>=0?'+':''}${esc(change)} ${esc(latest.unit)})`}`:'',prs=[record.load?`<div class="pr-line"><strong>Load PR: ${esc(record.load.value)}${record.load.reps?` × ${esc(record.load.reps)}`:''}</strong></div>`:'',record.reps?`<div class="pr-line"><strong>Rep PR: ${esc(record.reps.value)} reps${record.reps.load?` at ${esc(record.reps.load)}`:''}</strong></div>`:'',record.duration?`<div class="pr-line"><strong>Duration PR: ${esc(record.duration.seconds)} sec</strong></div>`:''].filter(Boolean).join('');return `<div class="card"><div class="eyebrow">${esc(record.exercise)}</div>${prs}<div class="status">${esc(record.semantics)} · ${trend.length} sessions${comparison}</div></div>`}).join('')||'<p class="empty">Complete workouts to see trends, recent comparisons, and records.</p>'}</div></div>${Object.values(state.adapter.workouts).some(workout=>workout.exercises.some(exercise=>exercise.equipment==='unknown'))?'<p class="warning">Some equipment meanings need configuration in the private form metadata before load suggestions are shown.</p>':''}`}
  async function load(){try{const [entries,config]=await Promise.all([smartNotesApp.query('entries',{limit:200}),smartNotesApp.query('config',{limit:1})]);state.rows=entries.rows;state.schema=entries.table.schema;state.form=config.rows[0].values.form_definition;state.adapter=D.deriveLegacyAdapter(state.form);status.textContent='Vault data current';if(!state.view){if(!await restoreDraft())newWorkout()}renderNutrition();if(state.tab==='history')renderHistory();if(state.tab==='progress')renderProgress()}catch(error){status.textContent=error.message}}
  load();
